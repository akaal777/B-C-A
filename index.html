<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Grand Line - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Body Styling */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            min-height: 100vh;
            color: #EAE0D5;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Animated Gradient Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header and Title Styling */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 4.5em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #4f46e5, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            position: relative;
            margin: 0;
            letter-spacing: 4px;
            animation: fadeInDown 1.5s ease-out;
        }

        /* Main Content and Button Container */
        main {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 900px;
            width: 100%;
            animation: fadeInUp 1.5s ease-out;
        }
        
        /* Staggered Animation for Buttons */
        .button-container button {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUpButton 0.5s forwards ease-out;
        }

        .button-container button:nth-child(1) { animation-delay: 0.6s; }
        .button-container button:nth-child(2) { animation-delay: 0.7s; }
        .button-container button:nth-child(3) { animation-delay: 0.8s; }
        .button-container button:nth-child(4) { animation-delay: 0.9s; }
        .button-container button:nth-child(5) { animation-delay: 1.0s; }
        .button-container button:nth-child(6) { animation-delay: 1.1s; }


        @keyframes fadeInUpButton {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Button Styling and Hover Effects */
        button {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.5em;
            padding: 20px 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover, button:focus {
            background-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.8);
            border-color: rgba(79, 70, 229, 0.8);
            transform: translateY(-5px);
            outline: none;
        }
        
        /* Shimmer Effect on Hover */
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }


        /* Entry Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* Responsive adjustments for tablets */
        @media (max-width: 768px) {
            body {
                justify-content: flex-start;
                padding-top: 60px;
            }
            h1 {
                font-size: 3em;
            }
            .button-container {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 25px;
            }
            button {
                font-size: 1.3em;
                padding: 18px 25px;
            }
        }

        /* Responsive adjustments for mobile phones */
        @media (max-width: 480px) {
             h1 {
                font-size: 2.2em;
            }
            .button-container {
                padding: 20px;
                gap: 15px;
            }
            button {
                font-size: 1.1em;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>BCA 3rd Semester</h1>
    </header>
    <main>
        <div class="button-container">
            <button onclick="redirectTo('mathematics.html')">🧭 Mathematics</button>
            <button onclick="redirectTo('c++.html')">⚙️ C++ Programming</button>
            <button onclick="redirectTo('English.html')">📜 English</button>
            <button onclick="redirectTo('Computer-Architecture.html')">🔩 Computer Architecture</button>
            <button onclick="redirectTo('MIS.html')">📈 MIS</button>
            <button onclick="redirectTo('Punjabi.html')">🌊 Punjabi</button>
        </div>
    </main>
    <script>
        // Page transition script remains the same as it's effective.
        function redirectTo(url) {
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        // This event listener helps prevent the fade-out transition when a user navigates back to the page.
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) { // Check if the page is from the back/forward cache
                document.body.style.transition = 'none';
                document.body.style.opacity = '1';
            } else {
                 document.body.style.opacity = '0';
                setTimeout(() => {
                    document.body.style.transition = 'opacity 0.5s ease-in';
                    document.body.style.opacity = '1';
                }, 50); // A small delay to ensure the transition is smooth on initial load
            }
        });
    </script>
</body>
</html>```
