<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>Computer Architecture Hub</title>
    <style>
        /* ---------- iOS design tokens ---------- */
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --label: #000000;
            --label-2: rgba(60, 60, 67, 0.6);
            --separator: rgba(60, 60, 67, 0.18);
            --blue: #007aff;
            --fill: rgba(120, 120, 128, 0.12);
            --bar: rgba(249, 249, 249, 0.82);
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --label: #ffffff;
                --label-2: rgba(235, 235, 245, 0.6);
                --separator: rgba(84, 84, 88, 0.6);
                --blue: #0a84ff;
                --fill: rgba(120, 120, 128, 0.24);
                --bar: rgba(29, 29, 31, 0.82);
                --shadow: none;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                         "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--label);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ---------- Frosted navigation bar ---------- */
        .nav {
            position: sticky;
            top: 0;
            z-index: 10;
            padding-top: env(safe-area-inset-top);
            background: var(--bar);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--separator);
        }
        .nav-inner {
            max-width: 960px;
            margin: 0 auto;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            padding: 0 16px;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right));
        }

        .large-title {
            font-size: clamp(30px, 6vw, 40px);
            font-weight: 700;
            letter-spacing: 0.37px;
            margin: 20px 4px 4px;
        }
        .subtitle {
            margin: 0 4px 8px;
            color: var(--label-2);
            font-size: 15px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: -0.08px;
            color: var(--label-2);
            margin: 28px 16px 8px;
        }

        /* ---------- Video cards ---------- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .video-card {
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }
        .player img, .player iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
        }
        .player .placeholder {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #5856d6, #007aff 60%, #5ac8fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        .player::after {            /* subtle dark overlay so the button pops */
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.35), rgba(0,0,0,0) 60%);
            pointer-events: none;
        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
            border: 0;
            border-radius: 50%;
            padding: 0;
            background: rgba(255, 255, 255, 0.82);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .play-btn svg { width: 26px; height: 26px; margin-left: 4px; fill: #1c1c1e; }
        .player:hover .play-btn { transform: translate(-50%, -50%) scale(1.08); background: #fff; }
        .play-btn:active { transform: translate(-50%, -50%) scale(0.94); }
        .play-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
        .player.playing::after { display: none; }

        .video-info { padding: 12px 16px 14px; }
        .video-title { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.4px; }
        .video-meta { font-size: 13px; color: var(--label-2); margin-top: 2px; }

        /* ---------- iOS grouped lists ---------- */
        .group {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 10px 16px;
            color: var(--label);
            text-decoration: none;
            font-size: 17px;
            position: relative;
            transition: background 0.15s ease;
        }
        .row + .row::before {
            content: "";
            position: absolute;
            top: 0;
            left: 60px;
            right: 0;
            height: 0.5px;
            background: var(--separator);
        }
        .row:active { background: var(--fill); }
        @media (hover: hover) { .row:hover { background: var(--fill); } }
        .row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

        .icon {
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .c-blue   { background: #007aff; }
        .c-green  { background: #34c759; }
        .c-orange { background: #ff9500; }
        .c-red    { background: #ff3b30; }
        .c-purple { background: #af52de; }
        .c-teal   { background: #30b0c7; }

        .row-label { flex: 1; min-width: 0; overflow-wrap: anywhere; letter-spacing: -0.4px; }
        .chevron {
            flex: 0 0 auto;
            width: 8px;
            height: 14px;
            stroke: var(--label-2);
            opacity: 0.6;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        footer {
            text-align: center;
            color: var(--label-2);
            font-size: 13px;
            margin-top: 32px;
            padding: 0 16px;
        }

        /* ---------- Responsive ---------- */
        @media (min-width: 900px) {
            .pdf-group { display: grid; grid-template-columns: 1fr 1fr; }
            .pdf-group .row + .row::before { display: none; }
            .pdf-group .row { border-bottom: 0.5px solid var(--separator); }
        }
        @media (max-width: 480px) {
            .video-grid { grid-template-columns: 1fr; }
            .play-btn { width: 56px; height: 56px; }
            .row { font-size: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="nav"><div class="nav-inner">Computer Architecture</div></div>

    <main>
        <h1 class="large-title">Computer Architecture Hub</h1>
        <p class="subtitle">Start your journey into the world of Computer Architecture.</p>

        <h2 class="section-title">Video Lectures</h2>
        <div class="video-grid" id="video-grid"></div>

        <h2 class="section-title">Reading Materials</h2>
        <div class="group" id="reading-list"></div>

        <h2 class="section-title">Downloadable PDFs</h2>
        <div class="group pdf-group" id="pdf-list"></div>

        <footer>Computer Architecture Hub</footer>
    </main>

    <script>
        /* ---------- Data ---------- */
        // type: 'video' -> single video id, 'playlist' -> playlist id
        const videos = [
            {
                type: 'playlist',
                id: 'PLxCzCOWd7aiHMonh3G6QNKq53C6oNXGrX',
                title: 'Computer Organization and Architecture',
                meta: 'Playlist',
                // Playlist thumbnails aren't available by a fixed URL, so we try oEmbed
                // and fall back to a gradient placeholder if it can't be fetched.
                oembed: 'https://www.youtube.com/playlist?list=PLxCzCOWd7aiHMonh3G6QNKq53C6oNXGrX'
            },
            { type: 'video', id: '1rUevQ3bSEY', title: 'COA [One Shot]', meta: 'Full revision in one video' },
            { type: 'video', id: 'DsK35f8wyUw', title: 'COA [One Shot]', meta: 'Knowledge Gate' },
            { type: 'video', id: 'nezosHntjPg', title: 'COA [One Shot] – Part 2', meta: 'Knowledge Gate' },
        ];

        const readingLinks = [
            { name: 'Instruction Format', color: 'c-blue',   tag: 'IF', url: 'https://www.geeksforgeeks.org/computer-organization-instruction-formats-zero-one-two-three-address-instruction/' },
            { name: 'RISC and CISC',      color: 'c-green',  tag: 'RC', url: 'https://www.geeksforgeeks.org/computer-organization-risc-and-cisc/' },
            { name: 'Register',           color: 'c-orange', tag: 'R',  url: 'https://www.geeksforgeeks.org/what-is-register-digital-electronics/' },
            { name: 'Class of Register',  color: 'c-purple', tag: 'CR', url: 'https://www.geeksforgeeks.org/different-classes-of-cpu-registers/' },
        ];

        const pdfLinks = [
            { name: '1. Basic Architecture',   url: 'https://drive.google.com/file/d/1y4N9E6LWARFdJp8HDEgywUY1lLQRdBl6/view' },
            { name: '2. CPU Organisation',     url: 'https://drive.google.com/file/d/1a-9ydYqpDwH84Eoxof-7JCqgACGxaHcn/view' },
            { name: '3. Instruction Set',      url: 'https://drive.google.com/file/d/1cf8_OJB92xZylxE2C7Hu-cLDLueu4mVr/view' },
            { name: '4. RISC and CISC',        url: 'https://drive.google.com/file/d/1WoenUVYMUsXGGnK2ztdHgqi13R6y4q3D/view' },
            { name: '5. Memory Organisation',  url: 'https://drive.google.com/file/d/1RUKPKyhxYRZwawMfI_xcdC6B2nkA6w_4/view' },
            { name: '6. Register Transfer',    url: 'https://drive.google.com/file/d/1MSnNrz0QxhjuL_2cD0_gACJ9BKs-wsOQ/view' },
            { name: '7. ALU',                  url: 'https://drive.google.com/file/d/1UWhsnfGka43c4q1GSvCnCN-hgNnUl7Nl/view' },
            { name: '8. Control Unit',         url: 'https://drive.google.com/file/d/1GH0DySYMuACuYJ_ci1A17dcxcvpxnFE7/view' },
            { name: '9. I/O Organization',     url: 'https://drive.google.com/file/d/1msKKcAHz3hN446A-ppFVjmJJ6xK-6_66/view' },
            { name: '10. Async Data Transfer', url: 'https://drive.google.com/file/d/1sMAP_t-F698cGNtwiCKgPAaAwklCxK6Z/view' },
        ];

        /* ---------- Helpers ---------- */
        const CHEVRON = '<svg class="chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>';
        const PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

        function embedUrl(v) {
            const base = 'https://www.youtube.com/embed/';
            return v.type === 'playlist'
                ? base + 'videoseries?list=' + v.id + '&autoplay=1&rel=0&playsinline=1'
                : base + v.id + '?autoplay=1&rel=0&playsinline=1';
        }

        function thumbUrl(v) {
            return v.type === 'video' ? 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg' : null;
        }

        /* ---------- Video cards: thumbnail first, play on click ---------- */
        function buildVideo(v) {
            const card = document.createElement('article');
            card.className = 'video-card';

            const player = document.createElement('div');
            player.className = 'player';

            const thumb = thumbUrl(v);
            if (thumb) {
                const img = document.createElement('img');
                img.src = thumb;
                img.alt = v.title + ' thumbnail';
                img.loading = 'lazy';
                player.appendChild(img);
            } else {
                const ph = document.createElement('div');
                ph.className = 'placeholder';
                ph.textContent = 'Playlist';
                player.appendChild(ph);
                // Try to fetch a real thumbnail for the playlist (CORS-friendly oEmbed proxy).
                fetch('https://noembed.com/embed?url=' + encodeURIComponent(v.oembed))
                    .then(r => r.json())
                    .then(d => {
                        if (d && d.thumbnail_url && !player.classList.contains('playing')) {
                            const img = document.createElement('img');
                            img.src = d.thumbnail_url;
                            img.alt = v.title + ' thumbnail';
                            player.insertBefore(img, ph);
                            ph.remove();
                        }
                    })
                    .catch(() => { /* keep gradient placeholder */ });
            }

            const btn = document.createElement('button');
            btn.className = 'play-btn';
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Play ' + v.title);
            btn.innerHTML = PLAY_SVG;
            player.appendChild(btn);

            function play() {
                if (player.classList.contains('playing')) return;
                player.classList.add('playing');
                player.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.src = embedUrl(v);
                iframe.title = v.title;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
                iframe.allowFullscreen = true;
                player.appendChild(iframe);
            }
            player.addEventListener('click', play);

            const info = document.createElement('div');
            info.className = 'video-info';
            info.innerHTML = '<h3 class="video-title"></h3><div class="video-meta"></div>';
            info.querySelector('.video-title').textContent = v.title;
            info.querySelector('.video-meta').textContent = v.meta;

            card.appendChild(player);
            card.appendChild(info);
            return card;
        }

        /* ---------- List rows ---------- */
        function buildRow(item, iconClass, iconText) {
            const a = document.createElement('a');
            a.className = 'row';
            a.href = item.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.innerHTML = '<span class="icon ' + iconClass + '">' + iconText + '</span>' +
                          '<span class="row-label"></span>' + CHEVRON;
            a.querySelector('.row-label').textContent = item.name;
            return a;
        }

        const videoGrid = document.getElementById('video-grid');
        videos.forEach(v => videoGrid.appendChild(buildVideo(v)));

        const readingList = document.getElementById('reading-list');
        readingLinks.forEach(l => readingList.appendChild(buildRow(l, l.color, l.tag)));

        const pdfList = document.getElementById('pdf-list');
        pdfLinks.forEach(l => pdfList.appendChild(buildRow(l, 'c-red', 'PDF')));
    </script>
</body>
</html>
